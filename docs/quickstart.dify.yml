app:
  description: Real Dify integration verification with Ace Data Cloud
  icon: null
  icon_background: null
  icon_type: emoji
  mode: workflow
  name: Qwen Image Step-by-step Tutorial
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload: {}
    sensitive_word_avoidance:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: tool
      id: start-generate
      source: start
      sourceHandle: source
      target: generate
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: tool
        targetType: tool
      id: generate-wait
      source: generate
      sourceHandle: source
      target: wait
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: tool
        targetType: end
      id: wait-end
      source: wait
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: Start
        type: start
        variables: []
      height: 73
      id: start
      position:
        x: 0
        y: 100
      positionAbsolute:
        x: 0
        y: 100
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    - data:
        desc: ''
        provider_id: acedatacloud/qwen-image/qwen-image
        provider_name: acedatacloud/qwen-image/qwen-image
        provider_type: builtin
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 1000
        selected: false
        title: Qwen Image
        tool_configurations:
          model:
            type: constant
            value: qwen-image-3.0
          n:
            type: constant
            value: 1
          size:
            type: constant
            value: 1024*1024
          watermark:
            type: constant
            value: false
        tool_label: Qwen Image 3
        tool_name: qwen_image
        tool_node_version: '2'
        tool_parameters:
          prompt:
            type: constant
            value: A single blue paper sphere on a cream background, studio product
              photograph, no text.
        type: tool
      height: 166
      id: generate
      position:
        x: 300
        y: 100
      positionAbsolute:
        x: 300
        y: 100
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    - data:
        desc: ''
        provider_id: acedatacloud/qwen-image/qwen-image
        provider_name: acedatacloud/qwen-image/qwen-image
        provider_type: builtin
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 1000
        selected: false
        title: Retrieve completed task
        tool_configurations:
          task_id:
            type: mixed
            value: '{{#generate.task_id#}}'
          wait_seconds:
            type: constant
            value: 240
        tool_label: Qwen Image Retrieve Task
        tool_name: qwen_image_task_retrieve
        tool_node_version: '2'
        tool_parameters: {}
        type: tool
      height: 114
      id: wait
      position:
        x: 600
        y: 100
      positionAbsolute:
        x: 600
        y: 100
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    - data:
        desc: ''
        outputs:
        - value_selector:
          - wait
          - status
          variable: status
        - value_selector:
          - wait
          - success
          variable: success
        - value_selector:
          - wait
          - task_id
          variable: task_id
        - value_selector:
          - wait
          - trace_id
          variable: trace_id
        - value_selector:
          - wait
          - media_urls
          variable: media_urls
        - value_selector:
          - wait
          - data
          variable: data
        - value_selector:
          - wait
          - result
          variable: result
        - value_selector:
          - wait
          - files
          variable: files
        selected: true
        title: Output
        type: end
      height: 270
      id: end
      position:
        x: 900
        y: 100
      positionAbsolute:
        x: 900
        y: 100
      selected: true
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    viewport:
      x: 60
      y: 160
      zoom: 0.8
  rag_pipeline_variables: []
