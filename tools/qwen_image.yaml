identity:
  name: qwen_image
  author: acedatacloud
  label:
    en_US: Qwen Image 3
    zh_Hans: Qwen Image 3
description:
  human:
    en_US: Generate or edit images with Qwen Image 3.
    zh_Hans: 使用 Qwen Image 3 生成或编辑图片。
  llm: Generate or edit images with Qwen Image 3. For asynchronous results, preserve
    task_id and use the task retrieval tool until completion. A successful submission
    is not completed output.
parameters:
- name: model
  type: select
  required: false
  form: form
  label:
    en_US: Model
    zh_Hans: 模型
  human_description:
    en_US: Select a model currently supported by this API. Availability and pricing
      depend on the chosen model.
    zh_Hans: 模型名称。qwen-image-3.0 适合高性价比批量创作；qwen-image-3.0-pro 提供更强细节与 1K/2K 分档。
  llm_description: Select a model currently supported by this API. Availability and
    pricing depend on the chosen model.
  default: qwen-image-3.0
  options:
  - value: qwen-image-3.0
    label:
      en_US: qwen-image-3.0
      zh_Hans: qwen-image-3.0
  - value: qwen-image-3.0-pro
    label:
      en_US: qwen-image-3.0-pro
      zh_Hans: qwen-image-3.0-pro
- name: prompt
  type: string
  required: true
  form: llm
  label:
    en_US: Prompt
    zh_Hans: 提示词
  human_description:
    en_US: Generation prompt or editing instruction. Include image_urls for edit mode.
    zh_Hans: 图像生成描述或编辑指令。编辑模式请同时传入 image_urls。
  llm_description: Generation prompt or editing instruction. Include image_urls for
    edit mode.
- name: image_urls
  type: string
  required: false
  form: form
  label:
    en_US: Reference images
    zh_Hans: 参考图
  human_description:
    en_US: Optional array of 1–3 reference image URLs, billed by the actual input
      image count. Enter a JSON array or object where applicable.
    zh_Hans: 可选参考图 URL 数组，支持 1–3 张；按真实输入张数计费。 数组或对象请使用 JSON 格式。
  llm_description: Optional array of 1–3 reference image URLs, billed by the actual
    input image count. Enter a JSON array or object where applicable.
- name: n
  type: number
  required: false
  form: form
  label:
    en_US: Count
    zh_Hans: 数量
  human_description:
    en_US: Number of output images, from 1 to 6.
    zh_Hans: 输出图片数量，1–6 张。
  llm_description: Number of output images, from 1 to 6.
  default: 1
  min: 1
  max: 6
- name: size
  type: string
  required: false
  form: form
  label:
    en_US: Size
    zh_Hans: 尺寸
  human_description:
    en_US: Output dimensions with pixel area between 512×512 and 2048×2048.
    zh_Hans: 输出尺寸，像素面积需在 512×512 至 2048×2048 之间。
  llm_description: Output dimensions with pixel area between 512×512 and 2048×2048.
  default: 1024*1024
- name: prompt_extend
  type: boolean
  required: false
  form: form
  label:
    en_US: Prompt enhancement
    zh_Hans: 提示词增强
  human_description:
    en_US: Whether to enhance the prompt.
    zh_Hans: 是否增强提示词。
  llm_description: Whether to enhance the prompt.
- name: prompt_extend_mode
  type: select
  required: false
  form: form
  label:
    en_US: Prompt Extend Mode
    zh_Hans: 提示词扩写模式
  human_description:
    en_US: Prompt enhancement mode; agent is text-to-image only.
    zh_Hans: 提示词增强模式；agent 仅用于文生图。
  llm_description: Prompt enhancement mode; agent is text-to-image only.
  options:
  - value: direct
    label:
      en_US: direct
      zh_Hans: direct
  - value: agent
    label:
      en_US: agent
      zh_Hans: agent
- name: enable_thinking
  type: boolean
  required: false
  form: form
  label:
    en_US: Enhanced reasoning
    zh_Hans: 增强推理
  human_description:
    en_US: Whether to enable enhanced reasoning.
    zh_Hans: 是否启用增强推理。
  llm_description: Whether to enable enhanced reasoning.
- name: negative_prompt
  type: string
  required: false
  form: form
  label:
    en_US: Negative Prompt
    zh_Hans: 反向提示词
  human_description:
    en_US: Content to exclude from the image.
    zh_Hans: 不希望出现在图像中的内容。
  llm_description: Content to exclude from the image.
- name: seed
  type: number
  required: false
  form: form
  label:
    en_US: Seed
    zh_Hans: 随机种子
  human_description:
    en_US: Random seed.
    zh_Hans: 随机种子。
  llm_description: Random seed.
  min: 0
  max: 2147483647
- name: watermark
  type: boolean
  required: false
  form: form
  label:
    en_US: Watermark
    zh_Hans: 水印
  human_description:
    en_US: Whether to add a watermark.
    zh_Hans: 是否添加水印。
  llm_description: Whether to add a watermark.
- name: callback_url
  type: string
  required: false
  form: form
  label:
    en_US: Callback Url
    zh_Hans: 回调 URL
  human_description:
    en_US: Callback URL for asynchronous completion.
    zh_Hans: 异步完成回调地址。
  llm_description: Callback URL for asynchronous completion.
output_schema:
  type: object
  properties:
    status:
      type: string
    success:
      type: boolean
    task_id:
      type: string
    trace_id:
      type: string
    media_urls:
      type: array
      items:
        type: string
    data: {}
    result:
      type: object
extra:
  python:
    source: tools/qwen_image.py
