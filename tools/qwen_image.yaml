identity:
  name: qwen_image
  author: acedatacloud
  label:
    en_US: Qwen Image 3
    zh_Hans: Qwen Image 3
description:
  human:
    en_US: Generate or edit images with Qwen Image 3.
    zh_Hans: 使用 Qwen Image 3 生成或编辑图片。
  llm: Generate images from text or edit one to three reference images. Generation
    returns a task ID. Query the same task until complete; never resubmit a pending
    generation.
parameters:
- name: model
  type: select
  required: false
  label:
    en_US: Model
    zh_Hans: 模型
  human_description:
    en_US: Select the current API model for this operation.
    zh_Hans: 模型名称。qwen-image-3.0 适合高性价比批量创作；qwen-image-3.0-pro 提供更强细节与 1K/2K 分档。
  llm_description: Select the current API model for this operation.
  form: form
  default: qwen-image-3.0
  options:
  - value: qwen-image-3.0
    label:
      en_US: qwen-image-3.0
      zh_Hans: qwen-image-3.0
  - value: qwen-image-3.0-pro
    label:
      en_US: qwen-image-3.0-pro
      zh_Hans: qwen-image-3.0-pro
- name: prompt
  type: string
  required: true
  label:
    en_US: Prompt
    zh_Hans: 提示词
  human_description:
    en_US: Generation or editing instruction.
    zh_Hans: 生成或编辑指令。
  llm_description: Generation or editing instruction.
  form: llm
- name: image_urls
  type: string
  required: false
  label:
    en_US: Reference images
    zh_Hans: 参考图
  human_description:
    en_US: One to three URLs Enter a JSON array.
    zh_Hans: 1–3 个图片 URL，每行一个。 请填写 JSON 数组。
  llm_description: One to three URLs Enter a JSON array.
  form: form
- name: n
  type: number
  required: false
  label:
    en_US: Count
    zh_Hans: 数量
  human_description:
    en_US: 1–6 outputs.
    zh_Hans: 输出 1–6 张。
  llm_description: 1–6 outputs.
  form: form
  default: 1
- name: size
  type: string
  required: false
  label:
    en_US: Size
    zh_Hans: 尺寸
  human_description:
    en_US: WIDTH*HEIGHT.
    zh_Hans: 宽*高。
  llm_description: WIDTH*HEIGHT.
  form: form
  default: 1024*1024
- name: prompt_extend
  type: boolean
  required: false
  label:
    en_US: Prompt enhancement
    zh_Hans: 提示词增强
  human_description:
    en_US: Enhance the prompt.
    zh_Hans: 增强提示词。
  llm_description: Enhance the prompt.
  form: form
  default: true
- name: prompt_extend_mode
  type: select
  required: false
  label:
    en_US: Prompt Extend Mode
    zh_Hans: 提示词扩写模式
  human_description:
    en_US: Set prompt extend mode.
    zh_Hans: 提示词增强模式；agent 仅用于文生图。
  llm_description: Set prompt extend mode.
  form: form
  default: direct
  options:
  - value: direct
    label:
      en_US: direct
      zh_Hans: direct
  - value: agent
    label:
      en_US: agent
      zh_Hans: agent
- name: enable_thinking
  type: boolean
  required: false
  label:
    en_US: Enhanced reasoning
    zh_Hans: 增强推理
  human_description:
    en_US: Improve instruction following.
    zh_Hans: 提升指令理解。
  llm_description: Improve instruction following.
  form: form
  default: true
- name: negative_prompt
  type: string
  required: false
  label:
    en_US: Negative Prompt
    zh_Hans: 反向提示词
  human_description:
    en_US: Set negative prompt.
    zh_Hans: 不希望出现在图像中的内容。
  llm_description: Set negative prompt.
  form: form
- name: seed
  type: number
  required: false
  label:
    en_US: Seed
    zh_Hans: 随机种子
  human_description:
    en_US: Set seed.
    zh_Hans: 随机种子。
  llm_description: Set seed.
  form: form
- name: watermark
  type: boolean
  required: false
  label:
    en_US: Watermark
    zh_Hans: 水印
  human_description:
    en_US: Add a watermark.
    zh_Hans: 添加水印。
  llm_description: Add a watermark.
  form: form
  default: false
output_schema:
  type: object
  properties:
    status:
      type: string
    success:
      type: boolean
    task_id:
      type: string
    trace_id:
      type: string
    media_urls:
      type: array
      items:
        type: string
    data: {}
    result:
      type: object
extra:
  python:
    source: tools/qwen_image.py
